# Docker's embedded DNS, so nginx re-resolves "backend" at request time
# instead of once at startup. Without this, nginx refuses to start at all
# if "backend" isn't resolvable yet (a real crash, not just a 502), and it
# would never pick up new IPs if the backend service is scaled.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api {
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
